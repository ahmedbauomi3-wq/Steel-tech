<title>Steel Technology | ستيل تكنولوجي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181c;--mute:#5b616b;--line:#dfe2e7;--dark:#16181c;--red:#d62828;--onDark:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--card:#1a1d22;--ink:#f1f2f4;--mute:#a1a7b0;--line:#2b2f36;--dark:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1114;--card:#1a1d22;--ink:#f1f2f4;--mute:#a1a7b0;--line:#2b2f36;--dark:#000;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;line-height:1.7}
.wrap{max-width:1080px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--dark);color:var(--onDark)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;direction:ltr}
.logo small{display:block;font-size:9px;letter-spacing:3px;color:#aaa;font-weight:400;line-height:1}
nav a{color:#ddd;text-decoration:none;margin:0 10px;font-size:14px}
nav{display:none}@media(min-width:760px){nav{display:block}}
.lang{background:none;border:1px solid #666;color:#fff;border-radius:6px;padding:3px 12px;font:inherit;cursor:pointer}
.hero{background:linear-gradient(135deg,#16181c,#2c3038);color:#fff;padding:64px 0 56px;text-align:center}
.hero h1{font-size:clamp(26px,6vw,46px);margin:0 0 10px;line-height:1.3}
.hero p{max-width:560px;margin:0 auto 24px;color:#c9ced6}
.bar{width:70px;height:4px;background:var(--red);margin:0 auto 18px;border-radius:2px}
.btn{display:inline-block;background:var(--red);color:#fff;border:0;padding:11px 26px;border-radius:8px;font:600 16px 'Cairo',sans-serif;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;border:1px solid #888;margin:0 6px}
section{padding:46px 0}
h2{font-size:26px;margin:0 0 6px}h2+p{color:var(--mute);margin:0 0 24px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;border-top:4px solid var(--red)}
.card .n{font-size:13px;color:var(--red);font-weight:800}
.card h3{margin:2px 0 6px;font-size:18px}.card p{margin:0 0 10px;color:var(--mute);font-size:14.5px}
.card ul{margin:0 0 14px;padding-inline-start:18px;font-size:14px}
.card a{color:var(--red);font-weight:600;text-decoration:none;font-size:14px}
.why{background:var(--card);border-block:1px solid var(--line)}
.why .grid div{text-align:center;padding:6px}.why b{display:block;font-size:17px}.why span{color:var(--mute);font-size:14px}
form{display:grid;gap:12px;max-width:520px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
footer{background:var(--dark);color:#bbb;text-align:center;padding:24px 0;font-size:14px}
.card img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;margin-bottom:10px;background:#e4e6ea;display:block}.ph{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}.hl{height:110px;background:#fff;border-radius:12px;padding:6px;margin-bottom:16px}</style>
</head>
